name: net-imap tests

on: [push, pull_request]

env:
  JRUBY_OPTS: '-J-ea'

jobs:

  net-imap:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # NOTE: failing on JRuby 10 due bundle -> pulling in rbs
        ruby-version: [ jruby-9.4.14.0 ] # jruby-10.0.6.0
        include:
          - ruby-version: jruby-9.4.14.0
            java-version: 11
          #- ruby-version: jruby-10.0.6.0
          #  java-version: 21
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check out net-imap submodule
        run: git submodule update --init net-imap

      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: set up ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: bundle install
        run: bash .github/scripts/bundle-install

      - name: build jopenssl.jar
        run: jruby -rbundler/setup -S rake jar

      - name: install net-imap deps
        run: jruby -S rake net-imap:bundle

      - name: net-imap tests
        timeout-minutes: 15
        # TLS tracing only for this run (test_starttls_unknown_ca intermittently hangs)
        env:
          JAVA_TOOL_OPTIONS: >-
            -Djruby.openssl.debug=true
            -Djavax.net.debug=ssl,handshake
        # the suite normally finishes in well under a minute - if it is still running the
        # watchdog dumps the stacks of *every* JRuby JVM (tests run in a child process)
        # two dumps a couple of minutes apart tell a parked thread from a spinning one
        run: |
          # jcmd -l lists attachable JVMs only (pgrep would also match this very script)
          dump_stacks() {
            echo "::group::thread dumps ($1)"
            for pid in $(env -u JAVA_TOOL_OPTIONS jcmd -l 2>/dev/null | awk '/org\.jruby\.Main/ {print $1}'); do
              echo "──────── pid $pid ────────"
              env -u JAVA_TOOL_OPTIONS jcmd "$pid" Thread.print -l 2>&1 || kill -QUIT "$pid" 2>/dev/null || true
            done
            echo "::endgroup::"
          }
          ( sleep 180; dump_stacks 'after 3m'; sleep 180; dump_stacks 'after 6m' ) &
          watchdog=$!
          set +e
          jruby -S rake net-imap:test
          rc=$?
          kill "$watchdog" 2>/dev/null
          exit $rc
