name: sigstore tests

on: [push, pull_request]

env:
  JRUBY_OPTS: '-J-ea'

jobs:

  sigstore:
    runs-on: ubuntu-latest

    strategy:
      matrix: # sigstore-ruby requires Ruby >= 3.2 (JRuby >= 10)
        ruby-version: [ jruby-10.0.6.0 ]
        include:
          - ruby-version: jruby-10.0.6.0
            java-version: 21
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check out sigstore-ruby submodule
        run: git submodule update --init sigstore-ruby

      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: set up ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: bundle install
        run: bash .github/scripts/bundle-install

      - name: build jopenssl.jar
        run: jruby -rbundler/setup -S rake jar

      - name: install sigstore-ruby deps
        run: jruby -S rake sigstore:bundle

      - name: sigstore tests
        run: jruby -S rake sigstore:test
        timeout-minutes: 15
